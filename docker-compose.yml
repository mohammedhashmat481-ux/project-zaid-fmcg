version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inkcrm-postgres
    restart: always
    environment:
      POSTGRES_USER: inkcrm_user
      POSTGRES_PASSWORD: inkcrm_password
      POSTGRES_DB: inkcrm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - inkcrm-network

  backend:
    build: ./backend
    container_name: inkcrm-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://inkcrm_user:inkcrm_password@postgres:5432/inkcrm
      - ADMIN_EMAIL=admin@crm.com
      - ADMIN_PASSWORD=admin_secure_password
      - JWT_SECRET=super_secret_jwt_access_token_key_12345
      - JWT_REFRESH_SECRET=super_secret_jwt_refresh_token_key_54321
      - ENCRYPTION_KEY=super_secret_face_encryption_key_32_bytes_long_1234
      - ALLOWED_ORIGINS=http://localhost,http://localhost:5173
    depends_on:
      - postgres
    networks:
      - inkcrm-network

  frontend:
    build: ./frontend
    container_name: inkcrm-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - inkcrm-network

volumes:
  postgres-data:

networks:
  inkcrm-network:
    driver: bridge
